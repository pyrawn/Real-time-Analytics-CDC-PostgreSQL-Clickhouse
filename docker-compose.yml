# Shared compose file — see docs/handoffs.md Section 0 before editing.
# Only add/edit the service block(s) that belong to your part.
#
#   postgres, generator      -> Julio      (docs/handoffs.md Section 1)
#   peerdb-*                 -> Valeria    (docs/handoffs.md Section 2)
#   clickhouse                -> Jose Angel (docs/handoffs.md Section 3)
#   (benchmark runs on-demand, not a long-running service — Leonora)
#   dashboard                 -> Lorena     (docs/handoffs.md Section 5)

x-minio-config: &minio-config
  PEERDB_CLICKHOUSE_AWS_CREDENTIALS_AWS_ACCESS_KEY_ID: _peerdb_minioadmin
  MINIO_ROOT_USER: _peerdb_minioadmin
  PEERDB_CLICKHOUSE_AWS_CREDENTIALS_AWS_SECRET_ACCESS_KEY: _peerdb_minioadmin
  MINIO_ROOT_PASSWORD: _peerdb_minioadmin
  PEERDB_CLICKHOUSE_AWS_CREDENTIALS_AWS_REGION: us-east-1
  PEERDB_CLICKHOUSE_AWS_CREDENTIALS_AWS_ENDPOINT_URL_S3: http://peerdb-minio:9000
  PEERDB_CLICKHOUSE_AWS_S3_BUCKET_NAME: peerdbbucket

x-catalog-config: &catalog-config
  PEERDB_CATALOG_HOST: peerdb-catalog
  PEERDB_CATALOG_PORT: 5432
  PEERDB_CATALOG_USER: postgres
  PEERDB_CATALOG_PASSWORD: postgres
  PEERDB_CATALOG_DATABASE: postgres

x-flow-worker-env: &flow-worker-env
  TEMPORAL_HOST_PORT: peerdb-temporal:7233
  TEMPORAL_CLIENT_CERT: ""
  TEMPORAL_CLIENT_KEY: ""
  PEERDB_TEMPORAL_NAMESPACE: default
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  AWS_REGION: ${AWS_REGION:-}
  AWS_ENDPOINT: ${AWS_ENDPOINT:-}

services:
  postgres:
    image: postgres:16
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: ["postgres", "-c", "wal_level=logical"]
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  generator:
    build: ./generator
    env_file: .env
    environment:
      PGHOST: postgres
      PGPORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy

  # --- peerdb services go here (Valeria) ---
  peerdb-catalog:
    container_name: peerdb-catalog
    image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    command: -c config_file=/etc/postgresql.conf
    restart: unless-stopped
    ports:
      - "9901:5432"
    environment:
      PGUSER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: --locale=C.UTF-8
    volumes:
      - peerdb_pgdata:/var/lib/postgresql
      - ./peerdb/volumes/postgresql.conf:/etc/postgresql.conf
      - ./peerdb/volumes/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "postgres", "-U", "postgres"]
      interval: 10s
      timeout: 30s
      retries: 5
      start_period: 60s

  peerdb-temporal:
    container_name: peerdb-temporal
    restart: unless-stopped
    depends_on:
      peerdb-catalog:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PWD=postgres
      - POSTGRES_SEEDS=peerdb-catalog
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    image: temporalio/auto-setup:1.29@sha256:f14912b699cf73015ad5c4fc18d522d4b014db90e794039214dfb7c022c2644f
    ports:
      - "7233:7233"
    volumes:
      - ./peerdb/volumes/temporal-dynamicconfig:/etc/temporal/config/dynamicconfig

  peerdb-temporal-admin-tools:
    container_name: peerdb-temporal-admin-tools
    restart: unless-stopped
    depends_on:
      - peerdb-temporal
    environment:
      - TEMPORAL_ADDRESS=peerdb-temporal:7233
      - TEMPORAL_CLI_ADDRESS=peerdb-temporal:7233
      - TEMPORAL_CLI_SHOW_STACKS=1
    image: temporalio/admin-tools:1.25.2-tctl-1.18.1-cli-1.1.1@sha256:da0c7a7982b571857173ab8f058e7f139b3054800abb4dcb100445d29a563ee8
    entrypoint: /etc/temporal/entrypoint.sh
    healthcheck:
      test: ["CMD", "tctl", "workflow", "list"]
      interval: 1s
      timeout: 5s
      retries: 30
    volumes:
      - ./peerdb/scripts/mirror-name-search.sh:/etc/temporal/entrypoint.sh

  peerdb-flow-api:
    container_name: peerdb-flow-api
    image: ghcr.io/peerdb-io/flow-api:stable-v0.37.7
    restart: unless-stopped
    ports:
      - "8112:8112"
      - "8113:8113"
    environment:
      <<: [*catalog-config, *flow-worker-env, *minio-config]
      PEERDB_ALLOWED_TARGETS: ""
    depends_on:
      peerdb-temporal-admin-tools:
        condition: service_healthy

  peerdb-flow-snapshot-worker:
    container_name: peerdb-flow-snapshot-worker
    image: ghcr.io/peerdb-io/flow-snapshot-worker:stable-v0.37.7
    restart: unless-stopped
    environment:
      <<: [*catalog-config, *flow-worker-env, *minio-config]
    depends_on:
      peerdb-temporal-admin-tools:
        condition: service_healthy

  peerdb-flow-worker:
    container_name: peerdb-flow-worker
    image: ghcr.io/peerdb-io/flow-worker:stable-v0.37.7
    restart: unless-stopped
    environment:
      <<: [*catalog-config, *flow-worker-env, *minio-config]
    depends_on:
      peerdb-temporal-admin-tools:
        condition: service_healthy

  peerdb-server:
    container_name: peerdb-server
    stop_signal: SIGINT
    image: ghcr.io/peerdb-io/peerdb-server:stable-v0.37.7
    restart: unless-stopped
    environment:
      <<: *catalog-config
      PEERDB_PASSWORD: ""
      PEERDB_FLOW_SERVER_ADDRESS: grpc://peerdb-flow-api:8112
      RUST_LOG: info
      RUST_BACKTRACE: "1"
    ports:
      - "9900:9900"
    depends_on:
      peerdb-catalog:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9900/api/v1/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  peerdb-ui:
    container_name: peerdb-ui
    image: ghcr.io/peerdb-io/peerdb-ui:stable-v0.37.7
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      <<: *catalog-config
      PEERDB_FLOW_SERVER_HTTP: http://peerdb-flow-api:8113
      NEXTAUTH_SECRET: __changeme__
      NEXTAUTH_URL: http://localhost:3000
      PEERDB_ALLOWED_TARGETS: ""
      PEERDB_CLICKHOUSE_ALLOWED_DOMAINS: ""
      PEERDB_EXPERIMENTAL_ENABLE_SCRIPTING: "true"
    depends_on:
      - peerdb-flow-api

  peerdb-minio:
    container_name: peerdb-minio
    image: minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    volumes:
      - peerdb_minio_data:/data
    ports:
      - "9001:9000"
      - "9002:36987"
    environment:
      <<: *minio-config
    entrypoint: >
      /bin/sh -c "
      minio server /data --console-address=:36987 &
      sleep 2;
      mc alias set myminiopeerdb http://127.0.0.1:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb myminiopeerdb/$$PEERDB_CLICKHOUSE_AWS_S3_BUCKET_NAME;
      wait
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  peerdb-init:
    container_name: peerdb-init
    image: postgres:16
    env_file: .env
    volumes:
      - ./peerdb/setup_mirror.sh:/setup_mirror.sh
    command: ["bash", "/setup_mirror.sh"]
    depends_on:
      peerdb-server:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    env_file: .env
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./clickhouse/init:/docker-entrypoint-initdb.d
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- dashboard service goes here (Lorena) ---

volumes:
  postgres_data:
  clickhouse_data:
  peerdb_pgdata:
  peerdb_minio_data:
